<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a5e"/>
      <stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a47"/>
      <stop offset="1" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fb2ff"/>
      <stop offset="1" stop-color="#2f6feb"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f59e2b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86e6b6"/>
      <stop offset="1" stop-color="#2fb57a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#101828" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.75">
    <path class="steam s1" d="M230 150 c-18 -24 18 -40 0 -64 s18 -40 0 -64"/>
    <path class="steam s2" d="M320 140 c-18 -24 18 -40 0 -64 s18 -40 0 -64"/>
    <path class="steam s3" d="M410 150 c-18 -24 18 -40 0 -64 s18 -40 0 -64"/>
  </g>

  <g filter="url(#shadow)">
    <!-- open lid, hinged at the back -->
    <g transform="rotate(-9 320 210)">
      <rect x="70" y="150" width="500" height="74" rx="34" fill="url(#lid)"/>
      <rect x="96" y="164" width="448" height="10" rx="5" fill="#ffffff" opacity="0.08"/>
      <rect x="290" y="206" width="60" height="30" rx="10" fill="#33456d"/>
    </g>

    <!-- box -->
    <rect x="60" y="210" width="520" height="300" rx="46" fill="url(#box)"/>
    <rect x="84" y="234" width="472" height="252" rx="30" fill="#0b1220"/>

    <!-- compartments -->
    <rect x="100" y="250" width="226" height="220" rx="20" fill="url(#blue)"/>
    <rect x="342" y="250" width="198" height="102" rx="20" fill="url(#amber)"/>
    <rect x="342" y="368" width="198" height="102" rx="20" fill="url(#green)"/>
  </g>

  <!-- a window packed into each compartment -->
  <g filter="url(#soft)">
    <g>
      <rect x="116" y="266" width="194" height="188" rx="12" fill="#f5f6f8"/>
      <rect x="116" y="266" width="194" height="26" rx="12" fill="#e3e6ec"/>
      <rect x="116" y="280" width="194" height="12" fill="#e3e6ec"/>
      <circle cx="132" cy="279" r="5" fill="#ff5f57"/>
      <circle cx="148" cy="279" r="5" fill="#febc2e"/>
      <circle cx="164" cy="279" r="5" fill="#28c840"/>
      <rect x="132" y="308" width="104" height="12" rx="6" fill="#c8ccd4"/>
      <rect x="132" y="332" width="160" height="9" rx="4.5" fill="#dde0e6"/>
      <rect x="132" y="351" width="142" height="9" rx="4.5" fill="#dde0e6"/>
      <rect x="132" y="370" width="152" height="9" rx="4.5" fill="#dde0e6"/>
      <rect x="132" y="398" width="78" height="12" rx="6" fill="#c8ccd4"/>
      <rect x="132" y="422" width="150" height="9" rx="4.5" fill="#dde0e6"/>
    </g>
    <g>
      <rect x="356" y="264" width="170" height="74" rx="10" fill="#f5f6f8"/>
      <rect x="356" y="264" width="170" height="20" rx="10" fill="#f1e6c8"/>
      <rect x="356" y="274" width="170" height="10" fill="#f1e6c8"/>
      <circle cx="369" cy="274" r="4" fill="#ff5f57"/>
      <circle cx="382" cy="274" r="4" fill="#febc2e"/>
      <circle cx="395" cy="274" r="4" fill="#28c840"/>
      <rect x="370" y="296" width="80" height="9" rx="4.5" fill="#ddcf9f"/>
      <rect x="370" y="314" width="134" height="7" rx="3.5" fill="#ece2c4"/>
    </g>
    <g>
      <rect x="356" y="382" width="170" height="74" rx="10" fill="#f5f6f8"/>
      <rect x="356" y="382" width="170" height="20" rx="10" fill="#d6efe2"/>
      <rect x="356" y="392" width="170" height="10" fill="#d6efe2"/>
      <circle cx="369" cy="392" r="4" fill="#ff5f57"/>
      <circle cx="382" cy="392" r="4" fill="#febc2e"/>
      <circle cx="395" cy="392" r="4" fill="#28c840"/>
      <rect x="370" y="414" width="64" height="9" rx="4.5" fill="#a9dcc2"/>
      <rect x="370" y="432" width="124" height="7" rx="3.5" fill="#d9eee3"/>
    </g>
  </g>

  <!-- fork, ready for lunch -->
  <g transform="rotate(18 590 360)" fill="#e9edf3">
    <rect x="583" y="300" width="14" height="190" rx="7"/>
    <rect x="566" y="226" width="48" height="84" rx="16"/>
    <rect x="570" y="190" width="8" height="54" rx="4"/>
    <rect x="586" y="190" width="8" height="54" rx="4"/>
    <rect x="602" y="190" width="8" height="54" rx="4"/>
  </g>
</svg>
